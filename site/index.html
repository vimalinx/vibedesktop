<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Vibe Desktop 把本机所有前后端分离的项目管成桌面上的一个图标：一起启动、一起停止、健康检查、分服务日志。在线体验它的网页桌面。Vibe Desktop runs every local frontend + backend project as one desktop app. Try the web preview.">
    <meta name="theme-color" content="#0b0f1c">
    <meta property="og:title" content="Vibe Desktop — 把前后端分离的项目，管成一个图标">
    <meta property="og:description" content="开源、只在本机运行的网页桌面。一起启停、健康检查、一键安装、可回滚。Open source, local only.">
    <title>Vibe Desktop — 把前后端分离的项目管成一个图标</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/desktop.css">
    <script src="/app.js" defer></script>
    <script type="module" src="/desktop/main.js"></script>
  </head>
  <body class="vd" data-page="desktop">
    <a class="skip-link" href="#vd-main">Skip to the desktop</a>
    <canvas class="vd-wallpaper" aria-hidden="true"></canvas>
    <div class="vd-grain" aria-hidden="true"></div>

    <div class="vd-boot" aria-hidden="true">
      <svg class="vd-boot-mark" viewBox="0 0 64 64">
        <path d="M14 38c9.5-22 26.5-22 36 0" pathLength="1"/>
        <circle cx="22" cy="39" r="5"/>
        <circle cx="42" cy="39" r="5"/>
      </svg>
      <p>Vibe Desktop</p>
    </div>

    <header class="vd-topbar">
      <button class="vd-brand" type="button" data-menu="brand" aria-haspopup="menu" aria-expanded="false">
        <img src="/icon.svg" width="22" height="22" alt="">
        <span>Vibe Desktop</span>
      </button>
      <nav class="vd-menus" aria-label="Menus">
        <button type="button" data-menu="apps" aria-haspopup="menu" aria-expanded="false" data-i18n="menu.apps">Apps</button>
        <button type="button" data-menu="windows" aria-haspopup="menu" aria-expanded="false" data-i18n="menu.windows">Windows</button>
        <button type="button" data-menu="scenes" aria-haspopup="menu" aria-expanded="false" data-i18n="menu.scenes">Scenes</button>
      </nav>
      <span class="vd-topbar-spacer"></span>
      <span class="vd-badge" tabindex="0" data-i18n="demo.badge" data-i18n-label="demo.tip">Web preview</span>
      <button class="vd-top-btn vd-search-btn" type="button" data-action="search">
        <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 17a6.5 6.5 0 100-13 6.5 6.5 0 000 13zM15.5 15.5L20 20"/></svg>
        <span data-i18n="menu.search">Search</span>
        <kbd data-search-key>Ctrl K</kbd>
      </button>
      <button class="vd-top-btn" type="button" data-action="wallpaper" data-i18n-label="menu.wallpaper">
        <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 15.5l4.5-4.5 4 4 2.5-2.5 5 5"/></svg>
      </button>
      <button class="vd-top-btn vd-lang" type="button" data-action="lang" data-i18n="menu.lang" data-i18n-label="menu.langLabel">EN</button>
      <time class="vd-clock"></time>
    </header>

    <main id="vd-main" class="vd-desk">
      <h1 class="visually-hidden">Vibe Desktop</h1>
      <nav class="vd-icons" aria-label="Desktop"></nav>
      <div class="vd-windows"></div>
    </main>

    <nav class="vd-dock" aria-label="Dock"></nav>
    <p class="vd-toast" role="status" aria-live="polite"></p>

    <noscript>
      <div class="vd-noscript">
        <h2>Vibe Desktop</h2>
        <p>把本机所有前后端分离的项目，放进同一个桌面里：一起启动、一起停止、健康检查、分服务看日志。开源、只在本机运行。</p>
        <p>Every frontend + backend project on your computer, as one desktop app: start and stop together, health checks, logs per service. Open source, local only.</p>
        <pre><code>curl -fsSL https://github.com/vimalinx/vibedesktop/releases/latest/download/install-app.sh | sh</code></pre>
        <p><a href="/apps">App market</a> · <a href="/developers">Developers</a> · <a href="https://github.com/vimalinx/vibedesktop">GitHub</a></p>
      </div>
    </noscript>
  </body>
</html>
